messages:
  prefix: "<gradient:#00f2fe:#4facfe><b>[LeftyPet]</b></gradient> "
  pet-summoned: "<gradient:#43e97b:#38f9d7>Pet kamu berhasil dipanggil!</gradient>"
  pet-dismissed: "<gradient:#f6d365:#fda085>Pet kamu disimpan ke alam spiritual.</gradient>"
  pet-fainted: "<gradient:#ff5f6d:#ffc371>Pet kamu kehabisan energi dan tertidur pingsan! Beri makan untuk membangunkannya.</gradient>"
  pet-fed: "<gradient:#43e97b:#38f9d7>Kamu memberi makan pet! Energi bertambah</gradient> <yellow>+{amount}%</yellow> <gray>(Sekarang: <aqua>{current}%</aqua>)</gray>"
  pet-mounted: "<gradient:#43e97b:#38f9d7>Kamu menaiki pet!</gradient> <yellow>W-A-S-D</yellow> <gray>untuk berjalan, dan</gray> <yellow>Spasi</yellow> <gray>untuk lompat/dash.</gray>"
  pet-dismounted: "<gradient:#f6d365:#fda085>Kamu turun dari pet.</gradient>"
  mount-level-too-low: "<gradient:#ff5f6d:#ffc371>Pet kamu minimal harus <b>Level {level}</b> untuk bisa dinaiki!</gradient>"
  altar-placed: "<gradient:#43e97b:#38f9d7>Pet Training Altar (3x3) berhasil dibangun!</gradient> <gray>Klik kanan lodestone untuk membuka menu altar.</gray>"
  altar-started: "<gradient:#43e97b:#38f9d7>Pet kamu diletakkan di Altar! Memulai proses upgrade ke <b>Level {targetLevel}</b> ({time}).</gradient>"
  altar-claimed: "<gradient:#ff9900:#ff00cc><b>SELAMAT!</b> Pet kamu berhasil di-upgrade ke <b>Level {level}</b>!</gradient>"
  altar-in-progress: "<gradient:#f6d365:#fda085>Altar sedang melatih pet! Sisa waktu: <b>{time}</b>.</gradient>"
  altar-already-training: "<gradient:#ff5f6d:#ffc371>Pet kamu sudah berada di dalam altar training lain!</gradient>"
  altar-max-level: "<gradient:#f6d365:#fda085>Pet kamu sudah mencapai Level Maksimal ({maxLevel})!</gradient>"
  pet-renamed: "<gradient:#43e97b:#38f9d7>Nama pet kamu berhasil diubah menjadi: </gradient>{name}"
