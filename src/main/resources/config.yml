# ==============================================================================
#                      LeftyPet Configuration
#                      Author: DarkIgnite
# ==============================================================================

settings:
  # Base scale of the Display Entity pet (1.0 = normal player head, 1.35 = big cute floating head)
  pet-scale: 1.35
  # Smooth float interpolation duration in ticks
  interpolation-duration: 3
  # Maximum pet level
  max-level: 100

# AFK Altar Upgrade Durations (in seconds)
# Formula: Level X -> Level X + 1
# Levels above 10 scale dynamically (+1800s / 30 mins per level) if not specified below
upgrade-durations:
  1: 30       # Lv 1 -> Lv 2: 30 seconds
  2: 90       # Lv 2 -> Lv 3: 1 min 30 sec
  3: 180      # Lv 3 -> Lv 4: 3 mins
  4: 300      # Lv 4 -> Lv 5: 5 mins
  5: 600      # Lv 5 -> Lv 6: 10 mins
  6: 900      # Lv 6 -> Lv 7: 15 mins
  7: 1500     # Lv 7 -> Lv 8: 25 mins
  8: 2400     # Lv 8 -> Lv 9: 40 mins
  9: 3600     # Lv 9 -> Lv 10: 60 mins (1 hour)
  10: 5400    # Lv 10 -> Lv 11: 90 mins (1.5 hours)

# Pet Energy & Hunger system
energy:
  max-energy: 100
  drain-per-attack: 1.5
  # Amount of energy restored by foods
  food-restore:
    COOKED_BEEF: 30
    COOKED_PORKCHOP: 30
    BREAD: 15
    APPLE: 10
    GOLDEN_CARROT: 45
    GOLDEN_APPLE: 100
    ENCHANTED_GOLDEN_APPLE: 100
    SWEET_BERRIES: 8

# Pet Upgrade Economy (Vault)
# Formula: base-cost + (currentLevel * cost-per-level)
economy:
  enabled: true
  base-cost: 1000.0
  cost-per-level: 500.0

# Pet Classes
classes:
  FIGHTER:
    display-name: "<gradient:#ff416c:#ff4b2b><b>FIGHTER</b></gradient>"
    icon: "DIAMOND_SWORD"
    description:
      - "&7Spesialis pertempuran jarak dekat & jauh."
      - "&e+50% &7Attack Damage"
      - "&e-30% &7Attack Cooldown"
    damage-multiplier: 1.5
    speed-multiplier: 1.0
  SUPPORT:
    display-name: "<gradient:#11998e:#38ef7d><b>SUPPORT</b></gradient>"
    icon: "GOLDEN_APPLE"
    description:
      - "&7Memberikan regenerasi HP saat player sekarat."
      - "&ePassive Aura &7Regeneration saat HP < 50%"
    damage-multiplier: 0.8
    speed-multiplier: 1.0
  LOOTER:
    display-name: "<gradient:#f7971e:#ffd200><b>LOOTER</b></gradient>"
    icon: "HOPPER"
    description:
      - "&7Otomatis mengambil drop item di sekitar."
      - "&e+25% &7Bonus Mob Experience"
    damage-multiplier: 0.8
    speed-multiplier: 1.0
  TRAVELER:
    display-name: "<gradient:#00c6ff:#0072ff><b>TRAVELER</b></gradient>"
    icon: "FEATHER"
    description:
      - "&7Spesialis penjelajahan & kecepatan."
      - "&ePassive Aura &7Speed II untuk pemilik."
      - "&e+40% &7Pet Movement Speed"
    damage-multiplier: 0.7
    speed-multiplier: 1.4

